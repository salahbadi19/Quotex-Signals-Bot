<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quotex Signals Bot - No Multiplier</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: white;
      padding: 30px;
      text-align: center;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 20px;
    }

    .box {
      background-color: #1a2a3a;
      border-radius: 15px;
      padding: 25px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
    }

    select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    select {
      background: #fff;
      color: #000;
    }

    button {
      background-color: #00c9a7;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #00a88a;
    }

    .signal {
      background: #112233;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      text-align: right;
      position: relative;
    }

    .signal strong {
      color: #00ffd1;
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #ccc;
    }

    .note {
      color: #ccc;
      font-size: 14px;
      margin-top: 10px;
      border-top: 1px solid #444;
      padding-top: 10px;
    }

    .timer {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #ffce00;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #00aaff;
      color: #fff;
      border: none;
      padding: 4px 8px;  /* Smaller padding */
      font-size: 12px;   /* Smaller font size */
      border-radius: 6px;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: #007acc;
    }
  </style>
</head>
<body>

  <h1>🚀 Quotex Signals - No Multiplier</h1>

  <div class="box">
    <label for="duration">Choose trade duration:</label>
    <select id="duration">
      <option value="30 seconds">30 seconds</option>
      <option value="1 minute">1 minute</option>
      <option value="3 minutes">3 minutes</option>
      <option value="5 minutes">5 minutes</option>
    </select>

    <button onclick="generateSignal()">Generate Signal</button>

    <div id="signalContainer"></div>

    <div class="note">
      This version does not rely on any multiplier 🔒<br>
      High accuracy with only one signal per trade.
    </div>
  </div>

  <div class="footer">
    This site works with <strong>Quotex platform currencies</strong>
  </div>

  <script>
    const currencies = [
      "EUR/USD (OTC)", "USD/INR (OTC)", "USD/TRY (OTC)", "GBP/CHF (OTC)", "GBP/JPY (OTC)",
      "USD/DZD (OTC)", "USD/MXN (OTC)", "AUD/USD (OTC)", "USD/JPY (OTC)", "EUR/GBP (OTC)",
      "GBP/AUD (OTC)", "NZD/JPY (OTC)", "USD/IDR (OTC)", "USD/PHP (OTC)", "NZD/CAD (OTC)",
      "USD/COP (OTC)", "EUR/CAD (OTC)", "USD/ARS (OTC)", "GBP/USD (OTC)", "AUD/JPY (OTC)",
      "USD/EGP (OTC)", "EUR/AUD (OTC)", "USD/BDT (OTC)", "USD/CAD (OTC)", "AUD/CAD (OTC)",
      "AUD/CHF (OTC)", "CAD/CHF (OTC)", "EUR/CHF (OTC)", "NZD/CHF (OTC)", "USD/CHF (OTC)",
      "USD/NGN (OTC)", "USD/PKR (OTC)", "CHF/JPY (OTC)"
    ];

    let timerInterval;

    function generateSignal() {
      clearInterval(timerInterval);
      const duration = document.getElementById("duration").value;
      const currency = currencies[Math.floor(Math.random() * currencies.length)];
      const signal = Math.random() > 0.5 ? "Buy 🔼" : "Sell 🔽";
      const accuracy = (Math.random() * (97 - 87) + 87).toFixed(2) + "%";
      const now = new Date().toLocaleTimeString();

      const content = `
        <div class="signal" id="signalBox">
          <button class="copy-btn" onclick="copySignal()">Copy</button>
          <p><strong>🔁 Currency:</strong> ${currency}</p>
          <p><strong>📊 Signal:</strong> ${signal}</p>
          <p><strong>⏱️ Duration:</strong> ${duration}</p>
          <p><strong>🎯 Accuracy:</strong> ${accuracy}</p>
          <p><strong>📅 Entry Time:</strong> ${now}</p>
          <div class="timer" id="timer">⏳ Timer: 60 seconds</div>
        </div>
      `;

      document.getElementById("signalContainer").innerHTML = content;

      // Start countdown timer
      let timeLeft = 60;
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerText = `⏳ Timer: ${timeLeft} seconds`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById("timer").innerText = "Time's up ⌛";
        }
      }, 1000);
    }

    function copySignal() {
      const text = document.getElementById("signalBox").innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert("✅ Signal copied!");
      });
    }
  </script>
</body>
</html>
